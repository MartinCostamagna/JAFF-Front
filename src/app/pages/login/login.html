<div class="divPrincipal">
    <div class="divLogin">

        <div class="divLogo">
            <img src="imagenes/LogoSinFondo.png" alt="Logo JAFF" class="logo">
        </div>

        <form class="login" [formGroup]="loginForm" (ngSubmit)="onSubmit()">
            <h1>Iniciar Sesión</h1>

            <div *ngIf="errorMessage" class="error-message">{{ errorMessage }}</div>

            <div class="divInputGroup">
                <label for="Email">Email</label>
                <input type="email" id="Email" required placeholder="Ingrese su email" formControlName="email" />
            </div>
            <div class="divInputGroup">
                <label for="contrasena">Contraseña</label>
                <input type="password" name="contrasena" id="contrasena" required placeholder="Ingrese su contraseña"
                    formControlName="contrasena" autocomplete="current-password" />
            </div>

            <button type="submit" [disabled]="loginForm.invalid || cargando">{{ cargando ? 'INGRESANDO...' : 'INICIAR
                SESIÓN' }}</button>

            <div class="divFooterLinks">
                <a href="#" class="forgot-password">¿Olvidó su contraseña?</a>
            </div>
        </form>
    </div>
</div>
